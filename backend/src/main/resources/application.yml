spring:
  application:
    name: redicap

  datasource:
    url: jdbc:postgresql://localhost:5432/redicap
    username: redicap_user
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

  session:
    store-type: none
    timeout: 8h

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

redicap:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 28800000
  security:
    max-intentos-fallidos: 3
    bloqueo-minutos: 15
    # Swagger/actuator: nunca expuestos por omisión (DFR R11). Encender solo en desarrollo
    # local con -Dredicap.security.exponer-documentacion=true.
    exponer-documentacion: false
  storage:
    actas-path: /opt/redicap/actas
  scheduler:
    corte-cron: "0 */10 * * * *"

management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
